<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wall Test</title>
<style>
body{margin:0;background:#16161d;color:#eee;font:14px system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:12px 16px}
h1{font-size:20px;margin:4px 0}p{margin:4px 0 10px;color:#aaa}
.wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
canvas{width:min(100%,640px);touch-action:none;border-radius:12px;display:block}
#panel{flex:1;min-width:260px}
label{display:grid;grid-template-columns:90px 1fr 56px;gap:6px;align-items:center;margin:3px 0;font-size:12px}
input{width:100%;margin:0}
button{font:inherit;padding:8px 14px;border:0;border-radius:10px;background:#cffb2d;color:#16161d;font-weight:600;margin:0 6px 8px 0}
button.off{background:#34343f;color:#eee}
#read{font:13px ui-monospace,monospace;background:#22222b;padding:8px;border-radius:8px;margin-bottom:8px;white-space:pre}
</style></head><body><main>
<h1>Wall Test</h1>
<p>Drag the speaker (lime) around. You are the pink blob: arrow keys move you, or use "Move me". Headphones show the panning best.</p>
<div class="wrap"><div><canvas id="c" width="768" height="448"></canvas></div>
<div id="panel"><button id="go">Start sound</button><button id="bypass" class="off">Bypass walls</button><button id="who" class="off">Move me</button>
<div id="read">press Start sound</div><div id="sliders"></div><button id="reset" class="off">Reset numbers</button></div></div>
</main><script type="module">
import { createListener, wallsOnGrid } from "/dist/index.js";
const W = 24, H = 14, T = 32;
const tiles = Array.from({ length: H }, () => Array(W).fill(null));
for (let y = 0; y < 7; y++) tiles[y][10] = "thin";
for (let y = 7; y < H; y++) tiles[y][10] = "solid";
for (let x = 11; x < W; x++) tiles[7][x] = "solid";
for (let y = 0; y < 4; y++) tiles[y][15] = "solid";
for (let x = 15; x < W; x++) tiles[3][x] = "solid";
tiles[3][10] = null; // A doorway, so sound can be clear between hall and room.
const roomAt = (s) => (s.x < 10 ? null : s.y >= 8 ? "cave" : "room");
const fill = { null: "#2a2a35", room: "#2f3a4a", cave: "#3a2f4a" };

const listener = { x: 8.5, y: 5.5 }, source = { x: 14.5, y: 4.5 };
let bypass = false, moveMe = false, started = false;
const $ = (id) => document.getElementById(id);
const ctx = new AudioContext();
const analyser = new AnalyserNode(ctx, { fftSize: 4096, smoothingTimeConstant: 0.9 });
analyser.connect(ctx.destination);
const ear = createListener(ctx, {
  output: analyser,
  pos: () => listener,
  world: {
    wallsBetween: (a, b) => (bypass ? [] : wallsOnGrid(tiles, a, b)),
    reverbAt: (s) => roomAt(s),
  },
});
const input = new GainNode(ctx);
const speech = ear.source(input, { pos: () => source });
const { params: pr, materials: ma, reverbs: re } = ear;
const controls = [
  ["fullRadius", pr, "fullRadius", 0, 8, .5], ["silentRadius", pr, "silentRadius", 4, 24, .5],
  ["panWidth", pr, "panWidth", 0, 1, .05], ["panRange", pr, "panRange", 2, 16, 1],
  ["thin Hz", ma.thin, "hz", 300, 6000, 50], ["thin dB", ma.thin, "db", -30, 0, 1],
  ["solid Hz", ma.solid, "hz", 300, 6000, 50], ["solid dB", ma.solid, "db", -30, 0, 1],
  ["2+ walls Hz", pr.multiWall, "hz", 200, 3000, 50], ["2+ walls dB", pr.multiWall, "db", -40, 0, 1],
  ["room wet dB", re.room, "wetDb", -40, 0, 1], ["cave wet dB", re.cave, "wetDb", -40, 0, 1],
];
const initial = controls.map(([, o, k]) => o[k]);
function sliders() {
  $("sliders").replaceChildren(...controls.map(([name, obj, k, min, max, step]) => {
    const l = document.createElement("label");
    const i = Object.assign(document.createElement("input"), { type: "range", min, max, step, value: obj[k] });
    const o = document.createElement("span"); o.textContent = obj[k];
    i.oninput = () => { obj[k] = +i.value; o.textContent = i.value; };
    l.append(name, i, o); return l;
  }));
}
sliders();
$("reset").onclick = () => { controls.forEach(([, o, k], n) => { o[k] = initial[n]; }); sliders(); };
$("bypass").onclick = (e) => { bypass = !bypass; e.target.className = bypass ? "" : "off"; };
$("who").onclick = (e) => { moveMe = !moveMe; e.target.className = moveMe ? "" : "off"; };

$("go").onclick = async () => {
  if (started) { if (ctx.state === "running") await ctx.suspend(); else await ctx.resume(); $("go").textContent = ctx.state === "running" ? "Pause" : "Start sound"; return; }
  started = true;
  await ctx.resume();
  $("go").textContent = "Pause";
  const data = await (await fetch("speech.wav")).arrayBuffer();
  const src = new AudioBufferSourceNode(ctx, { buffer: await ctx.decodeAudioData(data), loop: true });
  src.connect(input);
  src.start();
  window.demo.ready = true;
};

const c = $("c"), g = c.getContext("2d");
function pointer(e) {
  if (e.type !== "pointerdown" && !e.buttons && e.pointerType !== "mouse") return;
  if (e.pointerType === "mouse" && !e.buttons) return;
  const r = c.getBoundingClientRect();
  const t = moveMe ? listener : source;
  t.x = Math.max(.5, Math.min(W - .5, (e.clientX - r.left) / r.width * W));
  t.y = Math.max(.5, Math.min(H - .5, (e.clientY - r.top) / r.height * H));
}
c.onpointerdown = (e) => { c.setPointerCapture(e.pointerId); pointer(e); };
c.onpointermove = pointer;
addEventListener("keydown", (e) => {
  const d = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[e.key];
  if (!d) return; e.preventDefault();
  listener.x = Math.max(.5, Math.min(W - .5, listener.x + d[0] * .5));
  listener.y = Math.max(.5, Math.min(H - .5, listener.y + d[1] * .5));
});

function blob(s, col) {
  g.fillStyle = col; g.beginPath(); g.ellipse(s.x * T, s.y * T, 14, 12, 0, 0, 7); g.fill();
  g.fillStyle = "#16161d";
  for (const o of [-5, 5]) { g.beginPath(); g.arc(s.x * T + o, s.y * T - 1, 2.2, 0, 7); g.fill(); }
}
let last;
function frame() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    g.fillStyle = fill[roomAt({ x, y: y })] ;
    g.fillRect(x * T, y * T, T, T);
    if (tiles[y][x]) { g.fillStyle = tiles[y][x] === "thin" ? "#8795a8" : "#e8e8ef"; g.fillRect(x * T, y * T, T, T); }
  }
  g.font = "bold 14px system-ui"; g.fillStyle = "#ffffff99";
  g.fillText("HALL (no reverb)", 12, 22); g.fillText("ROOM", 372, 22); g.fillText("CLOSET: 2 walls", 520, 22); g.fillText("CAVE", 372, 290);
  g.fillText("thin", 290, 150); g.fillText("solid", 285, 400);
  g.strokeStyle = "#ffffff"; g.globalAlpha = .12; g.lineWidth = 2;
  for (const r of [pr.fullRadius, pr.silentRadius]) { g.beginPath(); g.arc(listener.x * T, listener.y * T, r * T, 0, 7); g.stroke(); }
  g.globalAlpha = 1;
  blob(listener, "#ff8fb1"); blob(source, "#cffb2d");

  ear.update();
  const m = speech.mix, room = speech.reverb;
  const label = bypass ? "bypassed" : m.walls.length === 0 ? "clear" : m.walls.length > 1 ? `${m.walls.length} walls` : `${m.walls[0]} wall`;
  last = { ...m, room, label };
  $("read").textContent = `${label}  room: ${room ?? "hall"}  (${speech.state})\ndistance ${m.distance.toFixed(1)} tiles\ngain ${(20 * Math.log10(m.gain + 1e-5)).toFixed(0)} dB  cutoff ${m.cutoff} Hz\npan ${m.pan.toFixed(2)}`;
  requestAnimationFrame(frame);
}
frame();

window.demo = {
  set(x, y) { source.x = x; source.y = y; },
  get last() { return last; },
  bands() {
    const b = new Float32Array(analyser.frequencyBinCount); analyser.getFloatFrequencyData(b);
    const hz = ctx.sampleRate / analyser.fftSize, energy = (lo, hi) => { let s = 0; for (let i = Math.floor(lo / hz); i < hi / hz; i++) s += 10 ** (b[i] / 10); return 10 * Math.log10(s + 1e-12); };
    return { low: energy(100, 700), high: energy(2500, 5000) };
  },
};
</script></body></html>
